services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: uoa
      MYSQL_USER: uoa
      MYSQL_PASSWORD: ${DB_PASS:-uoa}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "3307:3306"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: uoa
      DB_PASS: ${DB_PASS:-uoa}
      DB_NAME: uoa
      NWN_PORT: "6041"
      DM_PASSWORD: ${DM_PASSWORD:-dmpassword}
      CHROME_BINARY: /usr/bin/chromium
    volumes:
      - .:/var/www/html
      - /var/www/html/www/node_modules
      - ${HOME}/.claude:/home/dev/.claude
      - ${HOME}/.claude-docker.json:/home/dev/.claude.json
    ports:
      - "88:80"
    working_dir: /var/www/html

networks:
  default:
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  db_data:
