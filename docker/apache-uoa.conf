<VirtualHost *:80>
    DocumentRoot /var/www/html/www/public

    # Serve terrain tile GIFs and domain/screenshot JPGs from www/ root.
    # PHP pages reference these as bare filenames (e.g. forest.gif, Dom_01.jpg)
    # which the browser resolves to /forest.gif — aliased here to www/.
    AliasMatch "^/([^/]+\.(gif|jpg|jpeg|png))$" "/var/www/html/www/$1"

    <Directory "/var/www/html/www">
        Options FollowSymLinks
        Require all granted
    </Directory>

    <Directory "/var/www/html/www/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
