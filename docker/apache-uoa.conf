<VirtualHost *:80>
    DocumentRoot /var/www/html/www/public
    <Directory /var/www/html/www/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Wikis and maps kept in www/ beside the public site (managed outside this
    # repo). They are not under the document root, so each is mapped here.
    Alias /chronicles-wiki /var/www/html/www/chronicles-wiki
    Alias /tfn-wiki        /var/www/html/www/tfn-wiki
    Alias /hos1-wiki       /var/www/html/www/hos1-wiki
    Alias /erithorn-map    /var/www/html/www/erithorn-map
    <Directory /var/www/html/www/chronicles-wiki>
        Require all granted
    </Directory>
    <Directory /var/www/html/www/tfn-wiki>
        Require all granted
    </Directory>
    <Directory /var/www/html/www/hos1-wiki>
        Require all granted
    </Directory>
    <Directory /var/www/html/www/erithorn-map>
        Require all granted
    </Directory>
    # NWN web editor (nwn_web_editor.py running on the docker host, bound to
    # the compose bridge gateway so only containers can reach it directly).
    # Password-protected: the editor writes to the hos1 repo and this vhost
    # is internet-exposed. Manage users with:
    #   docker exec universeofarlandia_web_1 htpasswd /var/www/html/docker/qedit.htpasswd <user>
    <Location "/qedit">
        ProxyPass "http://172.23.0.1:8340/qedit"
        ProxyPassReverse "http://172.23.0.1:8340/qedit"
        AuthType Basic
        AuthName "NWN module editor"
        AuthUserFile /var/www/html/docker/qedit.htpasswd
        Require valid-user
    </Location>

    # nwn-area-editor for The Frozen North (nwn-manager's JSON-native area
    # editor, bound to the compose bridge gateway same as /qedit above).
    <Location "/tfn-qedit">
        ProxyPass "http://172.23.0.1:8341/tfn-qedit"
        ProxyPassReverse "http://172.23.0.1:8341/tfn-qedit"
        AuthType Basic
        AuthName "NWN module editor"
        AuthUserFile /var/www/html/docker/qedit.htpasswd
        Require valid-user
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
