<title>Language System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one reading column with a sticky section index on wide screens. */
:root{--bg:#f6f5f2;--fg:#23221f;--muted:#6a675f;--rule:#d9d6cd;--accent:#7a3b1e;--code-bg:#ebe8df;--th:#ece9e0;
--display:"Source Serif 4",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--fg:#e8e5dc;--muted:#a09c90;--rule:#383630;--accent:#e0a47e;--code-bg:#2a2824;--th:#262420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a18;--fg:#e8e5dc;--muted:#a09c90;--rule:#383630;--accent:#e0a47e;--code-bg:#2a2824;--th:#262420;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--body);padding-inline:16px;padding-block:32px}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px}
nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:6px;font-size:14px;padding-top:8px}
nav a{color:var(--muted);text-decoration:none}nav a:hover{color:var(--accent)}
nav b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
main{min-width:0;max-width:68ch}
h1{font:600 2.4rem/1.15 var(--display);margin:0 0 8px;text-wrap:balance}
h2{font:600 1.5rem/1.25 var(--display);margin:48px 0 12px;padding-top:16px;border-top:1px solid var(--rule);text-wrap:balance}
h3{font:600 1.1rem/1.3 var(--display);margin:28px 0 8px}
.sub{color:var(--muted);margin:0 0 24px}
p,ul{margin:0 0 14px}ul{padding-left:22px}li{margin-bottom:4px}
code{font:13.5px var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:3px}
.tbl{overflow-x:auto;margin:0 0 18px;border:1px solid var(--rule);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{background:var(--th);font-weight:600}tr:last-child td{border-bottom:0}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr);gap:16px}nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px 14px}nav b{width:100%}h1{font-size:1.9rem}}
</style>
<div class="wrap">
<nav><b>Sections</b>@@NAV@@</nav>
<main>
<h1>Language System</h1>
<p class="sub">UniverseOfArlandia, branch language-nwnx</p>
@@BODY@@
</main>
</div>
